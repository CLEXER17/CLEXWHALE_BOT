[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-whale-bot"
version = "1.0.0"
description = "Telegram bot that reports real Hyperliquid whale positions and large orders"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.6,<23.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27",
    "websockets>=13.0,<16.0",
    "SQLAlchemy>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.32",
    "aiosqlite>=0.20,<0.22",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.1",
]

[project.scripts]
whale-bot = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Every test creates its own event loop; the default function scope keeps the
# in-memory SQLite database and the alert queue isolated between tests.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = [
    # Long strings in the verbatim Telegram message templates.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"app/database/migrations/*" = ["I001"]
